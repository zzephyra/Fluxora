services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fluxora
      POSTGRES_PASSWORD: fluxora
      POSTGRES_DB: fluxora
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxora -d fluxora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fluxora
      MINIO_ROOT_PASSWORD: fluxora-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    image: fluxora-api
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://fluxora:fluxora@postgres:5432/fluxora
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      # Names only. Key values and base URLs come from the gitignored .env file.
      MODEL_SECRET_REFS: qianwen,local_model_secret,wan_video
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: fluxora
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: fluxora
      S3_SECRET_ACCESS_KEY: fluxora-local-secret
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "minio:host-gateway"
    volumes:
      - ./backend:/app
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  text-worker:
    image: fluxora-api
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://fluxora:fluxora@postgres:5432/fluxora
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      MODEL_SECRET_REFS: qianwen,local_model_secret,wan_video
    env_file:
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command:
      - python
      - -m
      - app.workers.text_completion
    restart: unless-stopped

  image-worker:
    image: fluxora-api
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://fluxora:fluxora@postgres:5432/fluxora
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      MODEL_SECRET_REFS: qianwen,local_model_secret,wan_video
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: fluxora
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: fluxora
      S3_SECRET_ACCESS_KEY: fluxora-local-secret
    env_file:
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "minio:host-gateway"
    volumes:
      - ./backend:/app
    command:
      - python
      - -m
      - app.workers.image_generation
    restart: unless-stopped

  video-worker:
    image: fluxora-api
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://fluxora:fluxora@postgres:5432/fluxora
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      MODEL_SECRET_REFS: qianwen,local_model_secret,wan_video
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: fluxora
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: fluxora
      S3_SECRET_ACCESS_KEY: fluxora-local-secret
    env_file:
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "minio:host-gateway"
    volumes:
      - ./backend:/app
    command:
      - python
      - -m
      - app.workers.video_generation
    restart: unless-stopped

  editor-worker:
    image: fluxora-api
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://fluxora:fluxora@postgres:5432/fluxora
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      MODEL_SECRET_REFS: qianwen,local_model_secret,wan_video
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: fluxora
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: fluxora
      S3_SECRET_ACCESS_KEY: fluxora-local-secret
    env_file:
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "minio:host-gateway"
    volumes:
      - ./backend:/app
    command:
      - python
      - -m
      - app.workers.editor_render
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
