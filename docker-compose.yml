services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fluxora
      POSTGRES_PASSWORD: fluxora
      POSTGRES_DB: fluxora
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxora -d fluxora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fluxora
      MINIO_ROOT_PASSWORD: fluxora-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
