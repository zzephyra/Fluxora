  <circle cx="1150" cy="102" r="4" fill="#67e8f9"/><circle cx="766" cy="325" r="3" fill="#a78bfa"/>
  <rect x=".5" y=".5" width="1279" height="479" rx="24" fill="none" stroke="#a78bfa" stroke-opacity=".15"/>
</svg>
