      <rect x="24" y="200" width="23" height="10" rx="3"/><rect x="67" y="200" width="23" height="10" rx="3"/><rect x="110" y="200" width="23" height="10" rx="3"/><rect x="153" y="200" width="23" height="10" rx="3"/><rect x="196" y="200" width="23" height="10" rx="3"/><rect x="239" y="200" width="23" height="10" rx="3"/><rect x="282" y="200" width="23" height="10" rx="3"/>
    </g>
    <circle cx="165" cy="112" r="48" fill="#c4b5fd" fill-opacity=".05" stroke="url(#line)" stroke-opacity=".3"/>
    <path d="M153 90L188 112L153 134Z" fill="url(#line)"/>
    <path d="M22 157L72 115L113 146M213 151L268 87L310 124" fill="none" stroke="url(#line)" stroke-opacity=".2"/>
