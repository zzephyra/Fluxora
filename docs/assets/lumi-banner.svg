    <rect width="330" height="224" rx="20" fill="url(#frame)" stroke="url(#line)" stroke-opacity=".7"/>
    <path d="M0 38H330M0 186H330" stroke="#a78bfa" stroke-opacity=".2"/>
    <g fill="#a78bfa" fill-opacity=".22">
